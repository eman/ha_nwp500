[tox]
envlist = py314,mypy,basedpyright,ruff,coverage
skipsdist = True
runner = uv-venv

[testenv]
description = Run unit tests with pytest
dependency_groups = test
commands_pre =
    python -m pip install -r {toxinidir}/requirements.txt
commands =
    pytest {posargs:tests/}

[testenv:py314]
description = Run tests on Python 3.14
basepython = python3.14

[testenv:mypy]
description = Run mypy type checking
deps = -r{toxinidir}/requirements.txt
dependency_groups = mypy
commands_pre =
commands =
    mypy

[testenv:basedpyright]
description = Run basedpyright type checking
deps = -r{toxinidir}/requirements.txt
dependency_groups = basedpyright
commands_pre =
commands =
    basedpyright

[testenv:ruff]
description = Run ruff linting and formatting checks
dependency_groups = lint
skip_install = True
commands_pre =
commands =
    ruff check custom_components/nwp500 tests scripts
    ruff format --check custom_components/nwp500 tests scripts

[testenv:coverage]
description = Run tests and generate coverage report
basepython = python3.14
dependency_groups = test
commands =
    pytest --cov=custom_components.nwp500 \
           --cov-report=term-missing \
           --cov-report=html \
           --cov-report=xml \
           --cov-fail-under=80 \
           {posargs:tests/}

[testenv:coverage-html]
description = Generate HTML coverage report
dependency_groups = test
commands =
    pytest --cov=custom_components.nwp500 \
           --cov-report=html \
           {posargs:tests/}
    python -m webbrowser htmlcov/index.html
