# Service definitions for Navien NWP500 integration

set_reservation:
  name: Set reservation
  description: >-
    Create or update a single reservation schedule entry. An existing entry
    scheduled for the same days and time is replaced, so repeating a call
    updates it rather than adding a duplicate. Reservations allow automatic
    mode and temperature changes at scheduled times. The device supports up
    to 16 reservation entries. The call returns once the device confirms it
    holds the new list, and fails if it does not.
  fields:
    device_id:
      name: Device
      description: The target NWP500 water heater device
      required: true
      selector:
        device:
          integration: nwp500
    entity_id:
      name: Entity
      description: The entity ID of the water heater (alternative to Device ID)
      required: false
      selector:
        entity:
          domain: water_heater
          integration: nwp500
    enabled:
      name: Enabled
      description: Whether this reservation entry is active
      required: true
      default: true
      selector:
        boolean:
    days:
      name: Days
      description: >-
        Days of the week for this reservation. Select one or more days.
      required: true
      selector:
        select:
          multiple: true
          options:
            - label: Sunday
              value: Sunday
            - label: Monday
              value: Monday
            - label: Tuesday
              value: Tuesday
            - label: Wednesday
              value: Wednesday
            - label: Thursday
              value: Thursday
            - label: Friday
              value: Friday
            - label: Saturday
              value: Saturday
    hour:
      name: Hour
      description: Hour of day (0-23) when reservation activates
      required: true
      selector:
        number:
          min: 0
          max: 23
          mode: box
    minute:
      name: Minute
      description: Minute of hour (0-59) when reservation activates
      required: true
      default: 0
      selector:
        number:
          min: 0
          max: 59
          mode: box
    mode:
      name: Operation mode
      description: DHW operation mode to set when reservation activates
      required: true
      selector:
        select:
          options:
            - label: Heat Pump Only
              value: heat_pump
            - label: Electric Only
              value: electric
            - label: Energy Saver (Hybrid)
              value: energy_saver
            - label: High Demand (Hybrid)
              value: high_demand
            - label: Power Off
              value: power_off
    temperature:
      name: Temperature
      description: >-
        Target temperature, in Home Assistant's temperature unit and within the
        heater's range. Required for heating modes, ignored for power off.
      required: false
      selector:
        number:
          min: 0
          max: 150
          step: 0.5
          mode: box

update_reservations:
  name: Update all reservations
  description: >-
    Replace all reservation entries with a new list. An advanced service for
    setting several entries at once; Set reservation adds a single entry. The
    call returns once the device confirms it holds the new list, and fails if
    it does not.
  fields:
    device_id:
      name: Device
      description: The target NWP500 water heater device
      required: true
      selector:
        device:
          integration: nwp500
    entity_id:
      name: Entity
      description: The entity ID of the water heater (alternative to Device ID)
      required: false
      selector:
        entity:
          domain: water_heater
          integration: nwp500
    reservations:
      name: Reservations
      description: >-
        List of reservation entries. Each entry should be a dictionary with keys:
        enable (2=enabled, 1=disabled), week (day bitfield), hour (0-23),
        min (0-59), mode (1=heat pump, 2=electric, 3=energy saver, 4=high demand,
        5=power off), param (temperature in half-degrees Celsius).
        Set reservation adds a single entry more simply.
      required: true
      selector:
        object:
    enabled:
      name: System enabled
      description: Whether the reservation system is enabled overall
      required: false
      default: true
      selector:
        boolean:

clear_reservations:
  name: Clear all reservations
  description: >-
    Remove all reservation schedules from the device. The call returns once
    the device confirms it holds the new list, and fails if it does not.
  fields:
    device_id:
      name: Device
      description: The target NWP500 water heater device
      required: true
      selector:
        device:
          integration: nwp500
    entity_id:
      name: Entity
      description: The entity ID of the water heater (alternative to Device ID)
      required: false
      selector:
        entity:
          domain: water_heater
          integration: nwp500

request_reservations:
  name: Request reservations
  description: >-
    Read the current reservation schedule from the device. It updates the
    Reservation schedule sensor and fires an nwp500_reservations_updated
    event.
  fields:
    device_id:
      name: Device
      description: The target NWP500 water heater device
      required: true
      selector:
        device:
          integration: nwp500
    entity_id:
      name: Entity
      description: The entity ID of the water heater (alternative to Device ID)
      required: false
      selector:
        entity:
          domain: water_heater
          integration: nwp500

enable_demand_response:
  name: Enable demand response
  description: >-
    Enable participation in utility demand response programs. When enabled,
    the device can respond to utility signals to reduce power consumption
    during peak demand periods.
  fields:
    device_id:
      name: Device
      description: The target NWP500 water heater device
      required: false
      selector:
        device:
          integration: nwp500
    entity_id:
      name: Entity
      description: The entity ID of the water heater (alternative to Device ID)
      required: false
      selector:
        entity:
          domain: water_heater
          integration: nwp500

disable_demand_response:
  name: Disable demand response
  description: Disable utility demand response participation
  fields:
    device_id:
      name: Device
      description: The target NWP500 water heater device
      required: false
      selector:
        device:
          integration: nwp500
    entity_id:
      name: Entity
      description: The entity ID of the water heater (alternative to Device ID)
      required: false
      selector:
        entity:
          domain: water_heater
          integration: nwp500

reset_air_filter:
  name: Reset air filter timer
  description: >-
    Reset the air filter maintenance timer. Use this after cleaning or
    replacing the air filter to restart the maintenance tracking.
  fields:
    device_id:
      name: Device
      description: The target NWP500 water heater device
      required: false
      selector:
        device:
          integration: nwp500
    entity_id:
      name: Entity
      description: The entity ID of the water heater (alternative to Device ID)
      required: false
      selector:
        entity:
          domain: water_heater
          integration: nwp500

set_vacation_days:
  name: Set vacation days
  description: >-
    Configure vacation mode duration. Sets the device to vacation mode for
    the specified number of days (1-99). Vacation mode reduces energy
    consumption during extended absences.
  fields:
    device_id:
      name: Device
      description: The target NWP500 water heater device
      required: false
      selector:
        device:
          integration: nwp500
    entity_id:
      name: Entity
      description: The entity ID of the water heater (alternative to Device ID)
      required: false
      selector:
        entity:
          domain: water_heater
          integration: nwp500
    days:
      name: Days
      description: Number of days for vacation mode (1-99)
      required: true
      selector:
        number:
          min: 1
          max: 99
          mode: box

set_vacation_duration:
  name: Set vacation duration
  description: >-
    Change the vacation day count without changing the operation mode.
    Unlike Set vacation days, this does not put the device into vacation
    mode; it only updates the number of days (1-99) the next vacation
    period will last.
  fields:
    device_id:
      name: Device
      description: The target NWP500 water heater device
      required: false
      selector:
        device:
          integration: nwp500
    entity_id:
      name: Entity
      description: The entity ID of the water heater (alternative to Device ID)
      required: false
      selector:
        entity:
          domain: water_heater
          integration: nwp500
    days:
      name: Days
      description: Vacation duration in days (1-99)
      required: true
      selector:
        number:
          min: 1
          max: 99
          mode: box

set_air_filter_life:
  name: Set air filter service interval
  description: >-
    Set how many evaporator-fan hours the air filter alarm counts before it
    trips. Accepts 0 to switch the alarm off, or 1000-10000 hours in steps
    of 500, which is what the NaviLink app offers. The device reports the
    interval back as the Air Filter Alarm Period sensor.
  fields:
    device_id:
      name: Device
      description: The target NWP500 water heater device
      required: false
      selector:
        device:
          integration: nwp500
    entity_id:
      name: Entity
      description: The entity ID of the water heater (alternative to Device ID)
      required: false
      selector:
        entity:
          domain: water_heater
          integration: nwp500
    hours:
      name: Hours
      description: >-
        Service interval in evaporator-fan hours: Off, or 1000-10000 in
        steps of 500, the choices the NaviLink app offers.
      required: true
      selector:
        select:
          mode: dropdown
          options:
            - label: "Off"
              value: "0"
            - label: "1000 h"
              value: "1000"
            - label: "1500 h"
              value: "1500"
            - label: "2000 h"
              value: "2000"
            - label: "2500 h"
              value: "2500"
            - label: "3000 h"
              value: "3000"
            - label: "3500 h"
              value: "3500"
            - label: "4000 h"
              value: "4000"
            - label: "4500 h"
              value: "4500"
            - label: "5000 h"
              value: "5000"
            - label: "5500 h"
              value: "5500"
            - label: "6000 h"
              value: "6000"
            - label: "6500 h"
              value: "6500"
            - label: "7000 h"
              value: "7000"
            - label: "7500 h"
              value: "7500"
            - label: "8000 h"
              value: "8000"
            - label: "8500 h"
              value: "8500"
            - label: "9000 h"
              value: "9000"
            - label: "9500 h"
              value: "9500"
            - label: "10000 h"
              value: "10000"

reset_condenser_fault:
  name: Reset condenser fault
  description: >-
    Clear a condenser fault. The NaviLink app shows this only to installer
    accounts, but the device accepts the command from any account. Use it
    after the cause of the fault has been dealt with.
  fields:
    device_id:
      name: Device
      description: The target NWP500 water heater device
      required: false
      selector:
        device:
          integration: nwp500
    entity_id:
      name: Entity
      description: The entity ID of the water heater (alternative to Device ID)
      required: false
      selector:
        entity:
          domain: water_heater
          integration: nwp500

set_recirculation_mode:
  name: Set recirculation mode
  description: >-
    Set the recirculation pump operation mode. Controls how the hot water
    recirculation system operates.
  fields:
    device_id:
      name: Device
      description: The target NWP500 water heater device
      required: false
      selector:
        device:
          integration: nwp500
    entity_id:
      name: Entity
      description: The entity ID of the water heater (alternative to Device ID)
      required: false
      selector:
        entity:
          domain: water_heater
          integration: nwp500
    mode:
      name: Mode
      description: >-
        Recirculation pump operation mode: 1=Always On, 2=Weekly schedule,
        3=Hot Button only, 4=Off
      required: true
      selector:
        select:
          options:
            - label: Always On
              value: "1"
            - label: Weekly schedule
              value: "2"
            - label: Hot Button only
              value: "3"
            - label: "Off"
              value: "4"

trigger_recirculation:
  name: Trigger recirculation
  description: >-
    Manually trigger the recirculation pump hot button. Immediately starts
    the recirculation pump to deliver hot water to fixtures.
  fields:
    device_id:
      name: Device
      description: The target NWP500 water heater device
      required: false
      selector:
        device:
          integration: nwp500
    entity_id:
      name: Entity
      description: The entity ID of the water heater (alternative to Device ID)
      required: false
      selector:
        entity:
          domain: water_heater
          integration: nwp500

configure_tou_schedule:
  name: Configure TOU schedule
  description: >-
    Configure the Time of Use (TOU) pricing schedule on the device.
    Up to 16 periods can be defined with seasonal, weekly, and
    time-based pricing information. The device uses this to optimize
    heating based on electricity rates.
  fields:
    device_id:
      name: Device
      description: The target NWP500 water heater device
      required: false
      selector:
        device:
          integration: nwp500
    entity_id:
      name: Entity
      description: The entity ID of the water heater (alternative to Device ID)
      required: false
      selector:
        entity:
          domain: water_heater
          integration: nwp500
    periods:
      name: TOU periods
      description: >-
        List of TOU period entries (max 16). Each entry is a dictionary with
        keys: season (month bitfield 0-4095), week (day bitfield 0-254,
        Sun=128..Sat=2),
        start_hour (0-23), start_minute (0-59), end_hour (0-23),
        end_minute (0-59), price_min (encoded price), price_max (encoded price),
        decimal_point (decimal places for price).
      required: true
      selector:
        object:
    enabled:
      name: Enabled
      description: Whether the TOU scheduling system is enabled
      required: false
      default: true
      selector:
        boolean:

request_tou_settings:
  name: Request TOU settings
  description: >-
    Read the programmed Time of Use (TOU) plan from the Navien cloud. The
    device has no way to report its TOU plan directly, so this reads the
    stored plan over the REST API. It updates the TOU schedule sensor and
    fires an nwp500_tou_updated event.
  fields:
    device_id:
      name: Device
      description: The target NWP500 water heater device
      required: false
      selector:
        device:
          integration: nwp500
    entity_id:
      name: Entity
      description: The entity ID of the water heater (alternative to Device ID)
      required: false
      selector:
        entity:
          domain: water_heater
          integration: nwp500

get_energy_usage:
  name: Get energy usage
  description: >-
    Ask the water heater for its recorded energy usage and return it as a
    report. The device keeps daily totals split between the heat pump and
    the electric heating elements; nothing is recorded in Home Assistant,
    the data is returned to the caller. Defaults to the current month. Ask
    for whole years instead to get one total per month.
  fields:
    device_id:
      name: Device
      description: The target NWP500 water heater device
      required: false
      selector:
        device:
          integration: nwp500
    entity_id:
      name: Entity
      description: The entity ID of the water heater (alternative to Device ID)
      required: false
      selector:
        entity:
          domain: water_heater
          integration: nwp500
    year:
      name: Year
      description: Year to report on. Defaults to the current year.
      required: false
      selector:
        number:
          min: 2000
          max: 2100
          mode: box
    months:
      name: Months
      description: >-
        Months to report on. Several may be requested at once. Defaults to
        the current month.
      required: false
      selector:
        select:
          multiple: true
          mode: dropdown
          options:
            - label: January
              value: "1"
            - label: February
              value: "2"
            - label: March
              value: "3"
            - label: April
              value: "4"
            - label: May
              value: "5"
            - label: June
              value: "6"
            - label: July
              value: "7"
            - label: August
              value: "8"
            - label: September
              value: "9"
            - label: October
              value: "10"
            - label: November
              value: "11"
            - label: December
              value: "12"
    years:
      name: Years
      description: >-
        Whole years to report on, one total per month. Cannot be combined
        with Year or Months.
      required: false
      selector:
        object:

simulate:
  name: Simulate
  description: >-
    Simulate the water heater, as the hot water simulator sees it, and return
    the result: each heating interval, the setpoint and mode writes as they
    would land, and the electricity used. Optionally lay a scenario document
    over the heater's, or try setpoint or mode changes. Changes nothing on the
    heater. Needs the hot water simulator turned on in the integration's
    options.
  fields:
    device_id:
      name: Device
      description: The target NWP500 water heater device
      required: false
      selector:
        device:
          integration: nwp500
    entity_id:
      name: Entity
      description: The entity ID of the water heater (alternative to Device ID)
      required: false
      selector:
        entity:
          domain: water_heater
          integration: nwp500
    hours:
      name: Hours
      description: How far ahead to simulate, 1 to 168 hours. Defaults to the scenario document's, else 24.
      required: false
      selector:
        number:
          min: 1
          max: 168
          mode: box
    writes:
      name: Changes to try
      description: >-
        Setpoint or mode changes to simulate, each with `at` (when), and
        `temperature` (in Home Assistant's unit), `mode`, or both. Modes:
        heat_pump, electric, energy_saver, high_demand, vacation or power_off;
        the result's reasons say when the simulator doesn't model one. These
        replace the scenario document's writes.
      required: false
      selector:
        object:
    include_points:
      name: Include the tank's path
      description: >-
        Also return the tank's temperatures along the way. Off by default:
        the path is long.
      required: false
      default: false
      selector:
        boolean:
    scenario:
      name: Scenario
      description: >-
        A scenario document (nwp500-python's, schema_version 1), as
        get_scenario returns one, laid over the heater's scenario: objects
        merge key by key, and any other value replaces the heater's.
        Temperatures in °F, volumes in US gallons. A params section replaces
        the parameters for the heater's tank size.
      required: false
      selector:
        object:
    use_heater:
      name: Start from the heater
      description: >-
        Start from the water heater's scenario now. Off: the scenario document
        alone, which must then give the whole scenario. On by default.
      required: false
      default: true
      selector:
        boolean:

get_scenario:
  name: Get scenario
  description: >-
    Return the scenario the hot water simulator walks for the water heater
    now, as a scenario document to edit and pass to the other simulator
    actions: the tank, its settings, schedules and surroundings, and the
    parameters for its tank size. With a scenario document, return it laid
    over the heater's. Changes nothing on the heater. Needs the hot water
    simulator turned on in the integration's options.
  fields:
    device_id:
      name: Device
      description: >-
        The target NWP500 water heater device
      required: false
      selector:
        device:
          integration: nwp500
    entity_id:
      name: Entity
      description: >-
        The entity ID of the water heater (alternative to Device ID)
      required: false
      selector:
        entity:
          domain: water_heater
          integration: nwp500
    scenario:
      name: Scenario
      description: >-
        A scenario document (nwp500-python's, schema_version 1), as
        get_scenario returns one, laid over the heater's scenario: objects
        merge key by key, and any other value replaces the heater's.
        Temperatures in °F, volumes in US gallons. A params section replaces
        the parameters for the heater's tank size.
      required: false
      selector:
        object:
    use_heater:
      name: Start from the heater
      description: >-
        Start from the water heater's scenario now. Off: the scenario document
        alone, which must then give the whole scenario. On by default.
      required: false
      default: true
      selector:
        boolean:

time_to_ready:
  name: Time to ready
  description: >-
    Return the hot water now and ahead, as the hot water simulator sees it:
    the gallons the tank can deliver, whether it can run a bath and when it
    can in each mode, and how many showers it's ready for. Changes nothing on
    the heater. Needs the hot water simulator turned on in the integration's
    options.
  fields:
    device_id:
      name: Device
      description: >-
        The target NWP500 water heater device
      required: false
      selector:
        device:
          integration: nwp500
    entity_id:
      name: Entity
      description: >-
        The entity ID of the water heater (alternative to Device ID)
      required: false
      selector:
        entity:
          domain: water_heater
          integration: nwp500
    bath_gal:
      name: Bath size
      description: >-
        A bath's volume in US gallons. Defaults to the simulator's, which the
        result's reasons name.
      required: false
      selector:
        number:
          min: 1
          max: 200
          step: 0.1
          mode: box
          unit_of_measurement: gal
    shower_gal:
      name: Shower size
      description: >-
        A shower's volume in US gallons. Defaults to the simulator's, which
        the result's reasons name.
      required: false
      selector:
        number:
          min: 1
          max: 100
          step: 0.1
          mode: box
          unit_of_measurement: gal
    scenario:
      name: Scenario
      description: >-
        A scenario document (nwp500-python's, schema_version 1), as
        get_scenario returns one, laid over the heater's scenario: objects
        merge key by key, and any other value replaces the heater's.
        Temperatures in °F, volumes in US gallons. A params section replaces
        the parameters for the heater's tank size.
      required: false
      selector:
        object:
    use_heater:
      name: Start from the heater
      description: >-
        Start from the water heater's scenario now. Off: the scenario document
        alone, which must then give the whole scenario. On by default.
      required: false
      default: true
      selector:
        boolean:

next_recovery:
  name: Next recovery
  description: >-
    Return the heat-pump recovery the water heater runs next, as the hot water
    simulator sees it: when it starts and ends, the energy it takes, and
    whether time-of-use limits cut it short. Changes nothing on the heater.
    Needs the hot water simulator turned on in the integration's options.
  fields:
    device_id:
      name: Device
      description: >-
        The target NWP500 water heater device
      required: false
      selector:
        device:
          integration: nwp500
    entity_id:
      name: Entity
      description: >-
        The entity ID of the water heater (alternative to Device ID)
      required: false
      selector:
        entity:
          domain: water_heater
          integration: nwp500
    scenario:
      name: Scenario
      description: >-
        A scenario document (nwp500-python's, schema_version 1), as
        get_scenario returns one, laid over the heater's scenario: objects
        merge key by key, and any other value replaces the heater's.
        Temperatures in °F, volumes in US gallons. A params section replaces
        the parameters for the heater's tank size.
      required: false
      selector:
        object:
    use_heater:
      name: Start from the heater
      description: >-
        Start from the water heater's scenario now. Off: the scenario document
        alone, which must then give the whole scenario. On by default.
      required: false
      default: true
      selector:
        boolean:

forecast:
  name: Forecast a recovery
  description: >-
    Return when a heat-pump recovery must start for the tank to be ready by a
    given time, as the hot water simulator sees it, and how long it runs.
    Changes nothing on the heater. Needs the hot water simulator turned on in
    the integration's options.
  fields:
    device_id:
      name: Device
      description: >-
        The target NWP500 water heater device
      required: false
      selector:
        device:
          integration: nwp500
    entity_id:
      name: Entity
      description: >-
        The entity ID of the water heater (alternative to Device ID)
      required: false
      selector:
        entity:
          domain: water_heater
          integration: nwp500
    target_time:
      name: Ready by
      description: >-
        When the tank must be ready, at most 168 hours after the scenario's
        start.
      required: true
      selector:
        datetime:
    target_f:
      name: Target temperature (°F)
      description: >-
        The temperature the tank must reach, in °F. Defaults to the heater's
        stop threshold, else its setpoint.
      required: false
      selector:
        number:
          min: 32
          max: 212
          step: 0.1
          mode: box
          unit_of_measurement: °F
    target_lower_f:
      name: Lower tank target (°F)
      description: >-
        For a partial charge: the temperature the lower tank must reach, in
        °F, in place of the target temperature.
      required: false
      selector:
        number:
          min: 32
          max: 212
          step: 0.1
          mode: box
          unit_of_measurement: °F
    scenario:
      name: Scenario
      description: >-
        A scenario document (nwp500-python's, schema_version 1), as
        get_scenario returns one, laid over the heater's scenario: objects
        merge key by key, and any other value replaces the heater's.
        Temperatures in °F, volumes in US gallons. A params section replaces
        the parameters for the heater's tank size.
      required: false
      selector:
        object:
    use_heater:
      name: Start from the heater
      description: >-
        Start from the water heater's scenario now. Off: the scenario document
        alone, which must then give the whole scenario. On by default.
      required: false
      default: true
      selector:
        boolean:

heater_profile:
  name: Heater profile
  description: >-
    Return what the hot water simulator models of the water heater: its modes
    and their heat sources, the commands, the setpoint range and step, and the
    tank's volume. Changes nothing on the heater. Needs the hot water
