# Dependabot configuration for automatic dependency updates
# Documentation: https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  # Monitor requirements.txt (runtime) and requirements-dev.txt (tooling).
  # Dependabot cannot edit manifest.json, which is the source of truth for
  # runtime pins, so a PR bumping nwp500-python or awsiotsdk will fail the
  # dependency-pins check by design. Redo those with
  # `python scripts/update_nwp500_version.py <version>` rather than merging
  # the raw bump.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    reviewers:
      - "eman"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Group nwp500-python and awsiotsdk updates together
    groups:
      nwp500-ecosystem:
        patterns:
          - "nwp500-python*"
          - "awsiotsdk*"
    # Only update to compatible versions
    versioning-strategy: increase

  # Monitor GitHub Actions (when added)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    reviewers:
      - "eman"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Monitor the devcontainer image (the only Dockerfile in the repo)
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    reviewers:
      - "eman"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps"
      include: "scope"
