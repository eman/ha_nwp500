# Dependabot configuration for automatic dependency updates
# Documentation: https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  # Monitor requirements.txt (runtime pins). Development tooling lives in
  # pyproject.toml's [dependency-groups]; Dependabot's pip ecosystem may not
  # track PEP 735 groups, so tooling updates can need bumping by hand.
  # Dependabot cannot edit manifest.json, which is the source of truth for
  # runtime pins, so a PR bumping nwp500-python or awsiotsdk will fail the
  # dependency-pins check by design. Redo those with
  # `python scripts/update_nwp500_version.py <version>` rather than merging
  # the raw bump.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    reviewers:
      - "eman"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Group nwp500-python and awsiotsdk updates together
    groups:
      nwp500-ecosystem:
        patterns:
          - "nwp500-python*"
          - "awsiotsdk*"
    # Only update to compatible versions
    versioning-strategy: increase
    ignore:
      # numpy and pandas in the sim group mirror Home Assistant's
      # package_constraints.txt, which is what users' Home Assistant
      # installs. They move by hand when that file moves. (pandas 3+ also
      # needs numpy>=2.3.3 on Python 3.14.)
      - dependency-name: "numpy"
      - dependency-name: "pandas"
      # pytest-homeassistant pins pytest exactly, matched to its Home
      # Assistant version. pytest moves when pytest-homeassistant does; a
      # pytest bump on its own cannot resolve.
      - dependency-name: "pytest"
      # The homeassistant floor in the mypy and basedpyright dependency
      # groups mirrors the minimum hacs.json declares for users. Type
      # checking against the oldest supported release is the point: it
      # catches an API a user on that version would not have. Raising the
      # floor to track the newest release makes the check weaker, so it
      # moves by hand when hacs.json moves.
      - dependency-name: "homeassistant"

  # Monitor GitHub Actions (when added)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    reviewers:
      - "eman"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Monitor the devcontainer image (the only Dockerfile in the repo)
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    reviewers:
      - "eman"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps"
      include: "scope"
