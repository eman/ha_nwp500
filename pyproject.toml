# Configuration only: this repository is a Home Assistant custom component,
# not a distributable Python package. There is deliberately no [project] or
# [build-system] table -- nothing here is ever built (tox sets skipsdist),
# and Home Assistant loads custom_components/nwp500/ directly.

# PEP 735 dependency groups. Development tooling only -- runtime pins live in
# requirements.txt, mirroring custom_components/nwp500/manifest.json, which is
# what Home Assistant actually installs.
#
# Groups mirror the tox environments so each one installs exactly what it
# needs: the test env pins Home Assistant through
# pytest-homeassistant-custom-component, while the type checkers resolve it
# directly.
#
# Full local setup:
#   uv pip install -r requirements.txt --group dev
[dependency-groups]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-homeassistant-custom-component>=0.13.356",
    "pytest-timeout>=2.4.0",
]
mypy = [
    "homeassistant>=2026.3.0",
    "mypy>=2.3.1",
]
basedpyright = [
    "homeassistant>=2026.3.0",
    "basedpyright>=1.39.10",
]
lint = [
    "ruff>=0.16.3",
]
dev = [
    {include-group = "test"},
    {include-group = "mypy"},
    {include-group = "basedpyright"},
    {include-group = "lint"},
    "tox>=4.0.0",
    "tox-uv>=1.36.0",
]

[tool.ruff]
line-length = 80
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "D",      # pydocstyle (PEP 257)
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "ISC",    # flake8-implicit-str-concat
    "S",      # bandit (security)
]
ignore = [
    "D100",   # Missing docstring in public module
    "D101",   # Missing docstring in public class
    "D102",   # Missing docstring in public method
    "D103",   # Missing docstring in public function
    "D104",   # Missing docstring in public package
    "D105",   # Missing docstring in magic method
    "D106",   # Missing docstring in public nested class
    "D107",   # Missing docstring in __init__
    "D203",   # 1 blank line required before class docstring (conflicts with D211)
    "D213",   # Multi-line docstring summary should start at the second line (conflicts with D212)
    "E501",   # Line too long (we handle this with line-length)
]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = ["S101"]
"custom_components/nwp500/const.py" = ["S105"]
"scripts/**/*.py" = ["S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
]
"custom_components/nwp500/__init__.py" = [
    "D104",  # Missing docstring in public package
]

[tool.pytest.ini_options]
# Test discovery patterns
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
testpaths = ["tests"]
minversion = "7.0"
asyncio_mode = "auto"
timeout = 300
timeout_method = "thread"
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
# Coverage flags intentionally live in tox's coverage env, not here, so an
# ad-hoc `pytest tests/unit/test_sensor.py` does not fail the coverage gate.
addopts = [
    "-v",
    "-l",
    "-ra",
    "-W",
    "default",
]
markers = [
    "unit: Unit tests that test individual components in isolation",
    "integration: Integration tests that test component interactions",
    "slow: Tests that take a long time to run",
    "network: Tests that require network access",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.mypy]
python_version = "3.14"
files = ["custom_components/nwp500", "scripts"]
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_calls = false
no_implicit_optional = true
disallow_any_generics = true
show_error_codes = true
show_column_numbers = true
show_error_context = true
pretty = true

# Third-party packages without type stubs. Written as [[tool.mypy.overrides]]
# because a bare ["tool.mypy-foo.*"] table is a quoted top-level key in TOML,
# not a mypy section -- mypy silently ignores it.
[[tool.mypy.overrides]]
module = [
    "awscrt.*",
    "homeassistant.*",
    "nwp500.*",
    "voluptuous.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["custom_components/nwp500"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/.tox/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
    "if self\\.debug",
    "\\.\\.\\.",
]
precision = 2
show_missing = true

[tool.coverage.html]
directory = "htmlcov"
